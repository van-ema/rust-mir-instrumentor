[package]
name = "afl_harness"
version = "0.1.0"
edition = "2021"

[features]
default = []
bytes_driver = ["dep:bytes"]
smallvec_driver = ["dep:smallvec"]
serde_json_driver = ["dep:serde", "dep:serde_json"]
toml_driver = ["dep:toml"]
base64_driver = ["dep:base64"]
uuid_driver = ["dep:uuid"]
itoa_driver = ["dep:itoa"]
quick_xml_driver = ["dep:quick-xml"]

[dependencies]
bytes = { path = "../third_party/bytes", optional = true }
smallvec = { path = "../third_party/smallvec", optional = true }
serde = { path = "../third_party/serde/serde", features = ["derive"], optional = true }
serde_json = { path = "../third_party/serde_json", optional = true }
toml = { version = "0.9.11", optional = true }
base64 = { version = "0.22", optional = true }
quick-xml = { version = "0.38", optional = true }
uuid = { version = "1.20.0", optional = true }
itoa = { version = "1.0", optional = true }

[[bin]]
name = "afl_bytes_driver"
path = "src/bin/afl_bytes_driver.rs"
required-features = ["bytes_driver"]

[[bin]]
name = "afl_smallvec_driver"
path = "src/bin/afl_smallvec_driver.rs"
required-features = ["smallvec_driver"]

[[bin]]
name = "afl_serde_json_driver"
path = "src/bin/afl_serde_json_driver.rs"
required-features = ["serde_json_driver"]

[[bin]]
name = "afl_toml_driver"
path = "src/bin/afl_toml_driver.rs"
required-features = ["toml_driver"]

[[bin]]
name = "afl_base64_driver"
path = "src/bin/afl_base64_driver.rs"
required-features = ["base64_driver"]

[[bin]]
name = "afl_uuid_driver"
path = "src/bin/afl_uuid_driver.rs"
required-features = ["uuid_driver"]

[[bin]]
name = "afl_itoa_driver"
path = "src/bin/afl_itoa_driver.rs"
required-features = ["itoa_driver"]

[[bin]]
name = "afl_quick_xml_driver"
path = "src/bin/afl_quick_xml_driver.rs"
required-features = ["quick_xml_driver"]
