[package]
name = "afl_harness"
version = "0.1.0"
edition = "2021"

[features]
default = []
bytes_driver = ["dep:bytes"]
smallvec_driver = ["dep:smallvec"]
serde_json_driver = ["dep:serde", "dep:serde_json"]
toml_driver = ["dep:toml"]
base64_driver = ["dep:base64"]
uuid_driver = ["dep:uuid"]
itoa_driver = ["dep:itoa"]
quick_xml_driver = ["dep:quick-xml"]
simd_json_driver = ["dep:simd-json"]
zip_driver = ["dep:zip"]
rkyv_driver = ["dep:rkyv"]
hyper_driver = ["dep:hyper", "dep:tokio", "dep:http-body-util"]
image_driver = ["dep:image"]

[dependencies]
bytes = { path = "../third_party/bytes", optional = true }
smallvec = { path = "../third_party/smallvec", features = ["std", "extract_if"], optional = true }
serde = { path = "../third_party/serde/serde", features = ["derive"], optional = true }
serde_json = { path = "../third_party/serde_json", optional = true }
toml = { version = "0.9.11", optional = true }
base64 = { version = "0.22", optional = true }
quick-xml = { version = "0.38", optional = true }
uuid = { version = "1.20.0", optional = true }
itoa = { version = "1.0", optional = true }
simd-json = { version = "0.14", features = ["serde_impl"], optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"], optional = true }
rkyv = { version = "0.8", default-features = false, features = ["std", "alloc", "bytecheck"], optional = true }
hyper = { path = "../third_party/hyper", features = ["full"], optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time", "sync"], optional = true }
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png"], optional = true }

[[bin]]
name = "afl_bytes_driver"
path = "src/bin/afl_bytes_driver.rs"
required-features = ["bytes_driver"]

[[bin]]
name = "afl_smallvec_driver"
path = "src/bin/afl_smallvec_driver.rs"
required-features = ["smallvec_driver"]

[[bin]]
name = "afl_serde_json_driver"
path = "src/bin/afl_serde_json_driver.rs"
required-features = ["serde_json_driver"]

[[bin]]
name = "afl_toml_driver"
path = "src/bin/afl_toml_driver.rs"
required-features = ["toml_driver"]

[[bin]]
name = "afl_base64_driver"
path = "src/bin/afl_base64_driver.rs"
required-features = ["base64_driver"]

[[bin]]
name = "afl_uuid_driver"
path = "src/bin/afl_uuid_driver.rs"
required-features = ["uuid_driver"]

[[bin]]
name = "afl_itoa_driver"
path = "src/bin/afl_itoa_driver.rs"
required-features = ["itoa_driver"]

[[bin]]
name = "afl_quick_xml_driver"
path = "src/bin/afl_quick_xml_driver.rs"
required-features = ["quick_xml_driver"]

[[bin]]
name = "afl_simd_json_driver"
path = "src/bin/afl_simd_json_driver.rs"
required-features = ["simd_json_driver"]

[[bin]]
name = "afl_zip_driver"
path = "src/bin/afl_zip_driver.rs"
required-features = ["zip_driver"]

[[bin]]
name = "afl_rkyv_driver"
path = "src/bin/afl_rkyv_driver.rs"
required-features = ["rkyv_driver"]

[[bin]]
name = "afl_hyper_driver"
path = "src/bin/afl_hyper_driver.rs"
required-features = ["hyper_driver"]

[[bin]]
name = "afl_image_driver"
path = "src/bin/afl_image_driver.rs"
required-features = ["image_driver"]

[[bin]]
name = "repro_smallvec_oracle_append_fp"
path = "src/bin/repro_smallvec_oracle_append_fp.rs"

[[bin]]
name = "repro_smallvec_old_harness_crash"
path = "src/bin/repro_smallvec_old_harness_crash.rs"
required-features = ["smallvec_driver"]
